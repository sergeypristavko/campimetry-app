<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Документация - Campimetry App</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Продуктовая документация приложения для периметрии">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #2563eb;
      --base-font-size: 16px;
    }

    .markdown-section {
      max-width: 900px;
      padding: 30px 45px 40px;
    }

    .markdown-section table {
      font-size: 0.9em;
    }

    .markdown-section code {
      background-color: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .markdown-section pre > code {
      padding: 1em;
    }

    .app-nav {
      position: fixed;
      margin: 0;
      padding: 10px 20px;
      right: 0;
      z-index: 10;
    }

    .app-nav a {
      color: var(--theme-color);
      font-weight: 500;
    }

    .github-corner svg {
      fill: var(--theme-color);
    }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>

  <script>
    window.$docsify = {
      name: 'Campimetry App',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,

      // Поиск
      search: {
        placeholder: 'Поиск по документации...',
        noData: 'Ничего не найдено',
        depth: 4,
        hideOtherSidebarContent: false,
      },

      // Пагинация
      pagination: {
        previousText: 'Предыдущая',
        nextText: 'Следующая',
      },

      // Плагины
      plugins: [
        // Ссылка на приложение
        function(hook, vm) {
          hook.beforeEach(function(html) {
            return html;
          });

          hook.afterEach(function(html) {
            const footer = `
              <hr/>
              <footer style="text-align: center; padding: 20px 0; color: #6b7280;">
                <p>
                  <a href="../" target="_blank" style="color: var(--theme-color); font-weight: 500;">
                    🔗 Открыть приложение
                  </a>
                </p>
                <p style="font-size: 0.9em;">
                  Версия документации: 1.0 | Последнее обновление: ${new Date().toLocaleDateString('ru-RU')}
                </p>
              </footer>
            `;
            return html + footer;
          });
        }
      ],

      // Копирование кода
      copyCode: {
        buttonText: 'Копировать',
        errorText: 'Ошибка',
        successText: 'Скопировано'
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Плагины -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>

  <!-- Подсветка синтаксиса -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
